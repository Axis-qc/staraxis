plugins {
  id 'java-library'
}

group = 'staraxis'

repositories {
  mavenCentral()
  mavenLocal()
  maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  maven { url = 'https://jitpack.io' }
}

dependencies {
  implementation project(':game')
  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation("com.badlogicgames.gdx:gdx-tools:$gdxVersion") { exclude group: 'com.badlogicgames.gdx', module: 'gdx-backend-lwjgl' }
  implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
  // JSON parsing & schema validation
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
  implementation 'com.networknt:json-schema-validator:1.0.87'
  // logging api only (binding provided by lwjgl3 via logback)
  implementation 'org.slf4j:slf4j-api:2.0.12'
  implementation "space.earlygrey:shapedrawer:$shapeDrawerVersion"

  // 纯逻辑单元测试（EntityClickResolver 等不依赖渲染层的决策逻辑）
  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
  // Gradle 9 起需显式声明 JUnit Platform launcher 到测试运行时 classpath
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
}
