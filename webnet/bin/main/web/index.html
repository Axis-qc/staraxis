<!doctype html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarAxis</title>
    <style>
        :root {
            --bg0: #070b16;
            --bg1: #0b1020;
            --panel: rgba(255, 255, 255, 0.04);
            --panel2: rgba(255, 255, 255, 0.06);
            --border: rgba(120, 160, 255, 0.22);
            --text: #e9eefc;
            --muted: rgba(233, 238, 252, 0.72);
            --primary: #4b7bff;
            --primary2: #2b55cf;
            --danger: #d14b4b;
            --ok: #35d07f;
            --warn: #f1c232;
            --shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
            --radius: 14px;

            --scrollbar-track: rgba(255, 255, 255, 0.06);
            --scrollbar-thumb: rgba(120, 160, 255, 0.38);
            --scrollbar-thumb-hover: rgba(120, 160, 255, 0.55);
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
            background:
                radial-gradient(1200px 700px at 20% 20%, rgba(75, 123, 255, 0.22), transparent 55%),
                radial-gradient(900px 600px at 80% 30%, rgba(53, 208, 127, 0.10), transparent 60%),
                radial-gradient(800px 500px at 60% 85%, rgba(241, 194, 50, 0.10), transparent 60%),
                linear-gradient(180deg, var(--bg0), var(--bg1));
            overflow: hidden;
        }

        /* scrollbar (Chromium/WebKit) */
        *::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        *::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 999px;
        }

        *::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 999px;
            border: 2px solid rgba(0, 0, 0, 0.25);
        }

        *::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* scrollbar (Firefox) */
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        .stars {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 20px 30px, rgba(255, 255, 255, 0.18), transparent 45%),
                radial-gradient(1px 1px at 220px 130px, rgba(255, 255, 255, 0.16), transparent 45%),
                radial-gradient(1px 1px at 420px 380px, rgba(255, 255, 255, 0.12), transparent 45%),
                radial-gradient(1px 1px at 720px 180px, rgba(255, 255, 255, 0.15), transparent 45%),
                radial-gradient(1px 1px at 980px 520px, rgba(255, 255, 255, 0.14), transparent 45%);
            opacity: 0.7;
            filter: blur(0.2px);
            pointer-events: none;
        }

        .container {
            position: relative;
            height: 100%;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 18px;
            padding: 28px;
            box-sizing: border-box;
            min-height: 0;
        }

        .panel {
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            min-height: 0;
        }

        .left {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
        }

        .brand {
            padding: 16px 14px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(75, 123, 255, 0.12), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(120, 160, 255, 0.25);
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 0.08em;
        }

        .brand .sub {
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 0;
        }

        .btn {
            width: 100%;
            text-align: left;
            padding: 12px 12px;
            border-radius: 12px;
            border: 1px solid rgba(120, 160, 255, 0.22);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: transform .06s ease, background .12s ease, border-color .12s ease;
        }

        .btn:hover {
            background: rgba(75, 123, 255, 0.10);
            border-color: rgba(120, 160, 255, 0.40);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn .title {
            font-weight: 650;
            font-size: 14px;
            letter-spacing: 0.02em;
        }

        .btn .desc {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .btn .tag {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(233, 238, 252, 0.85);
            background: rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        .btn[disabled] {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn[disabled]:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(120, 160, 255, 0.22);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .row .spacer {
            flex: 1;
        }

        .danger {
            border-color: rgba(209, 75, 75, 0.35) !important;
            background: rgba(209, 75, 75, 0.10) !important;
        }

        .danger:hover {
            background: rgba(209, 75, 75, 0.16) !important;
        }

        .leftFooter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
        }

        /* custom language dropdown */
        .langWrap {
            position: relative;
        }

        .langBtn {
            width: auto;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(120, 160, 255, 0.30);
            background: linear-gradient(180deg, rgba(75, 123, 255, 0.18), rgba(255, 255, 255, 0.05));
            color: rgba(233, 238, 252, 0.95);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
            transition: background .12s ease, border-color .12s ease, transform .06s ease;
            user-select: none;
        }

        .langBtn:hover {
            border-color: rgba(120, 160, 255, 0.55);
            background: linear-gradient(180deg, rgba(75, 123, 255, 0.26), rgba(255, 255, 255, 0.06));
        }

        .langBtn:active {
            transform: translateY(1px);
        }

        .langBtn .label {
            font-size: 12px;
            color: rgba(233, 238, 252, 0.78);
        }

        .langBtn .value {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .langBtn .caret {
            margin-left: 4px;
            opacity: 0.9;
            font-size: 12px;
        }

        .langMenu {
            position: absolute;
            left: 0;
            bottom: calc(100% + 8px);
            min-width: 220px;
            padding: 8px;
            border-radius: 14px;
            border: 1px solid rgba(120, 160, 255, 0.28);
            background: rgba(10, 14, 30, 0.94);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 20;
        }

        .langMenu.open {
            display: block;
        }

        .langItem {
            padding: 10px 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: rgba(233, 238, 252, 0.92);
            border: 1px solid transparent;
        }

        .langItem:hover {
            background: rgba(75, 123, 255, 0.18);
            border-color: rgba(120, 160, 255, 0.25);
        }

        .langItem.active {
            background: rgba(75, 123, 255, 0.26);
            border-color: rgba(120, 160, 255, 0.45);
        }

        .langItem .code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas;
            font-size: 12px;
            color: rgba(233, 238, 252, 0.70);
        }

        .right {
            padding: 18px;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 14px;
            min-height: 0;
        }

        .status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card {
            border: 1px solid rgba(120, 160, 255, 0.18);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
        }

        .kv {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
        }

        .kv code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas;
            color: rgba(233, 238, 252, 0.90);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            word-break: break-all;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(233, 238, 252, 0.88);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(233, 238, 252, 0.40);
        }

        .dot.ok {
            background: var(--ok);
        }

        .dot.warn {
            background: var(--warn);
        }

        .dot.bad {
            background: var(--danger);
        }

        .log {
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(120, 160, 255, 0.18);
            background: rgba(0, 0, 0, 0.25);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
            }

            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto;
            }
        }
    </style>
</head>

<body>
    <div class="stars"></div>
    <div class="container">
        <div class="panel left">
            <div class="brand">
                <h1>STARAXIS</h1>
                <div class="sub" id="subTitle">Web 版主菜单 · 本地单机（HTTP + WebSocket）</div>
            </div>

            <div class="menu">
                <button class="btn" id="btnNew">
                    <div>
                        <div class="title" id="tNew">新游戏</div>
                        <div class="desc" id="dNew">开始新的战役</div>
                    </div>
                    <div class="tag">Enter</div>
                </button>

                <button class="btn" id="btnLoad">
                    <div>
                        <div class="title" id="tLoad">加载游戏</div>
                        <div class="desc" id="dLoad">读取存档（占位）</div>
                    </div>
                    <div class="tag">Ctrl+L</div>
                </button>

                <button class="btn" id="btnMultiplayer" disabled>
                    <div>
                        <div class="title" id="tMp">多人游戏（开发中）</div>
                        <div class="desc" id="dMp">开发中</div>
                    </div>
                    <div class="tag" id="tagMp">开发中</div>
                </button>

                <button class="btn" id="btnShip">
                    <div>
                        <div class="title" id="tShip">舰船设计器</div>
                        <div class="desc" id="dShip">配置舰船模块（占位）</div>
                    </div>
                    <div class="tag">Ctrl+D</div>
                </button>

                <button class="btn" id="btnSettings">
                    <div>
                        <div class="title" id="tSettings">设置</div>
                        <div class="desc" id="dSettings">画面 / 声音 / 输入</div>
                    </div>
                    <div class="tag">Ctrl+S</div>
                </button>

                <div class="leftFooter">
                    <div class="langWrap" id="langWrap">
                        <div class="langBtn" id="langBtn" role="button" aria-haspopup="listbox" aria-expanded="false">
                            <span class="label" id="langLabel"></span>
                            <span class="value" id="langValue"></span>
                            <span class="caret">▾</span>
                        </div>
                        <div class="langMenu" id="langMenu" role="listbox"></div>
                    </div>

                    <button class="btn danger" id="btnQuit" style="width:auto;">
                        <div>
                            <div class="title" id="tQuit">退出</div>
                            <div class="desc" id="dQuit">关闭 WebNet 后台</div>
                        </div>
                        <div class="tag">Esc</div>
                    </button>
                </div>
            </div>
        </div>

        <div class="panel right">
            <div class="status">
                <div class="card">
                    <div class="row" style="justify-content: space-between; align-items:center;">
                        <div class="pill"><span class="dot" id="dotConn"></span><span id="connText">未连接</span></div>
                        <div class="pill"><span class="dot" id="dotLocal"></span><span id="localText">本地</span></div>
                    </div>
                    <div style="height: 10px"></div>
                    <div class="kv">
                        <div id="lHttp">HTTP</div>
                        <div><code id="http"></code></div>
                        <div id="lWs">WS</div>
                        <div><code id="ws"></code></div>
                        <div id="lConnections">连接数</div>
                        <div><code id="connCount">-</code></div>
                        <div id="lAutoExit">自动退出</div>
                        <div><code id="autoExit">-</code></div>
                    </div>
                    <div style="height: 10px"></div>
                    <div class="row">
                        <button class="btn" id="btnConnect" style="width:auto;">
                            <div>
                                <div class="title" id="tConnect">连接</div>
                                <div class="desc" id="connectHint">连接到本地 WS</div>
                            </div>
                        </button>
                        <button class="btn" id="btnPing" style="width:auto;" disabled>
                            <div>
                                <div class="title" id="lPing">Ping</div>
                                <div class="desc" id="lPingDesc">发送测试消息</div>
                            </div>
                        </button>
                        <div class="spacer"></div>
                        <button class="btn" id="btnRefreshStatus" style="width:auto;">
                            <div>
                                <div class="title" id="lRefresh">刷新</div>
                                <div class="desc" id="lRefreshDesc">读取 /api/status</div>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="card">
                    <div style="font-weight: 650; letter-spacing: 0.02em;" id="tLocalConn">本地连接情况</div>
                    <div style="height: 8px"></div>
                    <div class="kv">
                        <div id="lBrowser">浏览器</div>
                        <div><code id="ua"></code></div>
                        <div id="lPage">页面</div>
                        <div><code id="page"></code></div>
                        <div id="lTime">时间</div>
                        <div><code id="now"></code></div>
                    </div>
                </div>
            </div>

            <div class="log" id="log"></div>

            <div class="footer">
                <div id="footerHint">提示：这是 Web 主菜单原型，按钮暂为占位，后续会接入真实流程。</div>
                <div><code>/api/status</code> · <code>/api/quit</code> · <code>/api/i18n</code></div>
            </div>
        </div>
    </div>

    <script>
        const httpUrl = location.origin + '/';
        const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';

        const el = (id) => document.getElementById(id);

        el('http').textContent = httpUrl;
        el('ws').textContent = wsUrl;
        el('ua').textContent = navigator.userAgent;
        el('page').textContent = location.href;

        const dotConn = el('dotConn');
        const connText = el('connText');
        const localText = el('localText');
        const connCount = el('connCount');
        const autoExit = el('autoExit');
        const logEl = el('log');

        const btnConnect = el('btnConnect');
        const btnPing = el('btnPing');
        const btnRefreshStatus = el('btnRefreshStatus');

        const btnQuit = el('btnQuit');
        const btnNew = el('btnNew');
        const btnLoad = el('btnLoad');
        const btnShip = el('btnShip');
        const btnSettings = el('btnSettings');

        const langBtn = el('langBtn');
        const langMenu = el('langMenu');
        const langValue = el('langValue');

        let ws = null;
        let dict = {};
        let currentLang = localStorage.getItem('lang') || 'zh';
        let languages = [];

        function t(key) {
            return (dict && dict[key]) ? dict[key] : key;
        }

        function fmt(patternKey, ...args) {
            let s = t(patternKey);
            for (let i = 0; i < args.length; i++) {
                s = s.replaceAll('{' + i + '}', String(args[i]));
            }
            return s;
        }

        function applyI18n() {
            document.title = t('app.title');

            el('subTitle').textContent = t('mainMenu.web.subtitle');

            el('tNew').textContent = t('mainMenu.newGame');
            el('dNew').textContent = t('mainMenu.desc.newGame');

            el('tLoad').textContent = t('mainMenu.loadGame');
            el('dLoad').textContent = t('mainMenu.desc.loadGame');

            el('tMp').textContent = t('mainMenu.multiplayer');
            el('dMp').textContent = t('mainMenu.desc.multiplayer');
            el('tagMp').textContent = t('mainMenu.tag.developing');

            el('tShip').textContent = t('mainMenu.shipDesigner');
            el('dShip').textContent = t('mainMenu.desc.shipDesigner');

            el('tSettings').textContent = t('mainMenu.settings');
            el('dSettings').textContent = t('mainMenu.desc.settings');

            el('tQuit').textContent = t('mainMenu.exit');
            el('dQuit').textContent = t('mainMenu.desc.exit');

            el('tConnect').textContent = t('mainMenu.action.connect');
            el('connectHint').textContent = t('mainMenu.action.connectHint');

            el('tLocalConn').textContent = t('mainMenu.panel.localConnection');

            el('lHttp').textContent = t('mainMenu.label.http');
            el('lWs').textContent = t('mainMenu.label.ws');
            el('lConnections').textContent = t('mainMenu.label.connections');
            el('lAutoExit').textContent = t('mainMenu.label.autoExit');

            el('lPing').textContent = t('mainMenu.action.ping');
            el('lPingDesc').textContent = t('mainMenu.action.pingDesc');
            el('lRefresh').textContent = t('mainMenu.action.refresh');
            el('lRefreshDesc').textContent = t('mainMenu.action.refreshDesc');

            el('lBrowser').textContent = t('mainMenu.field.browser');
            el('lPage').textContent = t('mainMenu.field.page');
            el('lTime').textContent = t('mainMenu.field.time');

            el('footerHint').textContent = t('mainMenu.footer.hint');

            el('langLabel').textContent = t('lang.current');
            langValue.textContent = t('lang.selfName');

            // status text refresh
            updateConnText();
            localText.textContent = t('mainMenu.status.local');
        }

        async function loadI18n(lang) {
            try {
                const r = await fetch('/api/i18n/' + encodeURIComponent(lang));
                dict = await r.json();
                currentLang = lang;
                localStorage.setItem('lang', lang);
                applyI18n();
                log(fmt('mainMenu.log.i18nLoaded', lang, Object.keys(dict).length));
            } catch (e) {
                dict = {};
                applyI18n();
                log(fmt('mainMenu.log.i18nLoadFailed', lang));
            }
        }

        function setLangMenuOpen(open) {
            if (open) {
                langMenu.classList.add('open');
                langBtn.setAttribute('aria-expanded', 'true');
            } else {
                langMenu.classList.remove('open');
                langBtn.setAttribute('aria-expanded', 'false');
            }
        }

        function rebuildLangMenu() {
            langMenu.innerHTML = '';
            for (const l of languages) {
                const item = document.createElement('div');
                item.className = 'langItem' + (l === currentLang ? ' active' : '');
                item.setAttribute('role', 'option');
                item.dataset.lang = l;

                const left = document.createElement('div');
                left.textContent = l;
                const right = document.createElement('div');
                right.className = 'code';
                right.textContent = l;

                item.appendChild(left);
                item.appendChild(right);

                item.addEventListener('click', async () => {
                    setLangMenuOpen(false);
                    if (l !== currentLang) {
                        await loadI18n(l);
                        rebuildLangMenu();
                    }
                });

                langMenu.appendChild(item);
            }
        }

        async function loadLanguages() {
            try {
                const r = await fetch('/api/i18n/languages');
                languages = await r.json();
            } catch (e) {
                languages = [currentLang];
            }
            rebuildLangMenu();
        }

        function log(line) {
            const ts = new Date().toISOString().slice(11, 23);
            logEl.textContent = `[${ts}] ${line}\n` + logEl.textContent;
        }

        let connState = '';

        function setConn(state) {
            connState = state;
            dotConn.className = 'dot ' + state;
            updateConnText();
        }

        function updateConnText() {
            if (connState === 'ok') {
                connText.textContent = t('mainMenu.status.connected');
            } else if (connState === 'warn') {
                connText.textContent = t('mainMenu.status.connecting');
            } else if (connState === 'bad') {
                connText.textContent = t('mainMenu.status.disconnected');
            } else {
                connText.textContent = t('mainMenu.status.disconnected');
            }
        }

        function setNow() {
            el('now').textContent = new Date().toLocaleString();
        }

        async function refreshStatus() {
            try {
                const r = await fetch('/api/status');
                const j = await r.json();
                connCount.textContent = String(j.connections);
                autoExit.textContent = String(j.autoExitSeconds) + 's / idle ' + String(j.idleSeconds) + 's';
                log(fmt('mainMenu.log.status', JSON.stringify(j)));
            } catch (e) {
                connCount.textContent = '-';
                autoExit.textContent = '-';
                log(t('mainMenu.log.statusFailed'));
            }
        }

        function connectWs() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return;
            }
            setConn('warn');
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                setConn('ok');
                btnPing.disabled = false;
                log(t('mainMenu.log.wsOpen'));
                refreshStatus();
            };

            ws.onmessage = (ev) => {
                log(fmt('mainMenu.log.recv', ev.data));
            };

            ws.onclose = () => {
                setConn('bad');
                btnPing.disabled = true;
                log(t('mainMenu.log.wsClose'));
                refreshStatus();
            };

            ws.onerror = () => {
                setConn('bad');
                log(t('mainMenu.log.wsError'));
            };
        }

        function sendPing() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const msg = { type: 'ping', t: Date.now() };
            ws.send(JSON.stringify(msg));
            log(fmt('mainMenu.log.send', JSON.stringify(msg)));
        }

        async function quitServer() {
            try {
                log(t('mainMenu.log.quitRequest'));
                await fetch('/api/quit', { method: 'POST' });
                log(t('mainMenu.log.quitRequested'));
            } catch (e) {
                log(t('mainMenu.log.quitFailed'));
            }
        }

        function notImplemented(key) {
            log(fmt('mainMenu.log.developing', t(key)));
        }

        // Bind UI
        btnConnect.onclick = connectWs;
        btnPing.onclick = sendPing;
        btnRefreshStatus.onclick = refreshStatus;

        btnQuit.onclick = quitServer;

        btnNew.onclick = () => notImplemented('mainMenu.newGame');
        btnLoad.onclick = () => notImplemented('mainMenu.loadGame');
        btnShip.onclick = () => notImplemented('mainMenu.shipDesigner');
        btnSettings.onclick = () => notImplemented('mainMenu.settings');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = !langMenu.classList.contains('open');
            setLangMenuOpen(open);
        });

        document.addEventListener('click', () => {
            setLangMenuOpen(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && langMenu.classList.contains('open')) {
                setLangMenuOpen(false);
                e.preventDefault();
            }
        });

        // Hotkeys
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                quitServer();
            }
            if (e.key === 'Enter') {
                notImplemented('mainMenu.newGame');
            }
            if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')) {
                e.preventDefault();
                notImplemented('mainMenu.loadGame');
            }
            if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) {
                e.preventDefault();
                notImplemented('mainMenu.shipDesigner');
            }
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                notImplemented('mainMenu.settings');
            }
        });

        // Init
        setNow();
        setInterval(setNow, 1000);
        setConn('bad');

        (async () => {
            await loadLanguages();
            await loadI18n(currentLang);
            await refreshStatus();
        })();

        // 尝试在关闭页面时主动断开 WS（服务端仍会 auto-exit 兜底）
        window.addEventListener('beforeunload', () => {
            try {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.close();
                }
            } catch (e) { }
        });
    </script>
</body>

</html>
