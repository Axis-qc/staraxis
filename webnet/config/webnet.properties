# StarAxis WebNet Server Configuration
# Last Updated: 2026-02-15

# Host address to listen on (监听地址)
host=127.0.0.1

# Port to listen on (监听端口)
port=17890

# Idle timeout in seconds before auto-exit (<=0 to disable)
# 无连接空闲自动退出秒数
autoExitSeconds=120

# Whether to pre-start AI assistant (是否预启动 AI 助手)
aiPrestart=true

# Whether to enable server UI (是否启用服务器控制台 UI)
serverUi=true

# Game UI URL for auto-browse (前端界面地址)
gameUiUrl=http://127.0.0.1:5173/
