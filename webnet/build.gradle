plugins {
  id 'java-library'
  id 'application'
}

dependencies {
  implementation project(':game')

  // Undertow: HTTP + WebSocket server
  implementation 'io.undertow:undertow-core:2.3.12.Final'
  implementation 'io.undertow:undertow-websockets-jsr:2.3.12.Final'

  // JSON
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
  implementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'
  implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
  implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.2'

  // 单元测试：DTO 转换与序列化兼容验证喵
  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
  workingDir = rootProject.rootDir
}

application {
  mainClass = 'staraxis.webnet.WebNetLauncher'
}

tasks.register('fatJar', Jar) {
  archiveBaseName.set('webnet')
  archiveClassifier.set('all')

  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  manifest {
    attributes('Main-Class': application.mainClass.get())
  }

  // 包含 webnet 自身编译输出
  from(sourceSets.main.output)

  // 包含 game 模块编译输出（类文件和资源）
  from(project(':game').sourceSets.main.output)

  // 包含所有外部依赖（Undertow、Jackson 等）
  dependsOn configurations.runtimeClasspath
  from {
    configurations.runtimeClasspath
      .filter { !it.path.contains('game') } // 排除 game 的 jar（已直接包含上面的output）
      .collect { it.isDirectory() ? it : zipTree(it) }
  }
}

// 确保打包前先编译 game 模块
tasks.fatJar.dependsOn(':game:compileJava')
tasks.fatJar.dependsOn(':game:processResources')

// 注意：打包任务已移至根项目 build.gradle
// 使用 ./gradlew build 或 ./gradlew dist 构建完整发行版

run {
  workingDir = rootProject.rootDir

  onlyIf {
    gradle.startParameter.taskNames.any { name ->
      name == 'runWeb' || name == ':runWeb' || name == 'webnet:run' || name == ':webnet:run'
    }
  }

  if (project.hasProperty('serverUi')) {
    // no-op
  }
}
