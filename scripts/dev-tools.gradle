// StarAxis 自动化工具链 (StarAxis Dev Toolchain)
// 用于落实宪章中“禁止频繁使用终端命令”的原则。

def assetsDir = file("${rootProject.projectDir}/assets")
def coreSrcDir = file("${rootProject.projectDir}/core/src/main/java")

tasks.register('checkEnv') {
    group = 'staraxis'
    description = '检查开发环境一致性 (Check development environment consistency)'
    doLast {
        println "--- 环境自检 (Environment Check) ---"
        println "Java Version: ${System.getProperty('java.version')}"
        println "Project Dir: ${rootProject.projectDir}"
        
        if (!assetsDir.exists()) {
            throw new GradleException("错误：资源目录不存在 (Assets directory missing): ${assetsDir}")
        }
        println "✓ 资源目录就绪 (Assets directory ready)"
    }
}

tasks.register('syncAssets') {
    group = 'staraxis'
    description = '同步并校验资源文件 (Sync and validate assets)'
    dependsOn 'checkEnv'
    doLast {
        println "--- 资源同步 (Asset Sync) ---"
        // 可以在这里添加资源同步逻辑，如纹理打包检查等
        println "✓ 资源同步完成 (Assets synced)"
    }
}

tasks.register('checkDecoupling') {
    group = 'staraxis'
    description = '验证核心逻辑层与 UI 层的解耦情况 (Verify logic-UI decoupling)'
    doLast {
        println "--- 解耦自检 (Decoupling Check) ---"
        def forbiddenImport = 'com.badlogic.gdx.scenes.scene2d'
        def coreFiles = fileTree(coreSrcDir).include('**/*.java')
        def violations = []

        coreFiles.each { file ->
            if (file.text.contains(forbiddenImport)) {
                violations.add(file.path)
            }
        }

        if (!violations.isEmpty()) {
            println "❌ 发现违规 UI 引用 (UI References found in core):"
            violations.each { println "  - $it" }
            throw new GradleException("架构违规：Core 模块严禁引用 scene2d 组件。")
        } else {
            println "✓ 架构合规：Core 模块无 UI 依赖 (Core module is clean)"
        }
    }
}

tasks.register('runFullTests') {
    group = 'staraxis'
    description = '运行全量自动化测试 (Run all tests in sequence)'
    dependsOn ':core:test', ':lwjgl3:test'
    doLast {
        println "✓ 所有测试通过 (All tests passed)"
    }
}
