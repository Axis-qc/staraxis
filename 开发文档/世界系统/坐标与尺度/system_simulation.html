<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>system_simulation (GU版)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #hud {
            position: fixed;
            left: 10px;
            top: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            max-width: 520px;
            pointer-events: none;
            white-space: nowrap;
        }

        #hud .hl {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="hud">
        <div>缩放(数值越小越近): <span id="zoom" class="hl"></span> (行星/恒星UI阈值: 20/50)</div>
        <div>相机世界坐标(GU): <span id="cam" class="hl"></span></div>
        <div>鼠标世界坐标(GU): <span id="mw" class="hl"></span></div>
        <div>鼠标星区(q,r): <span id="ms" class="hl"></span></div>
        <div>选中: <span id="sel" class="hl">无</span></div>
        <div id="selpos"></div>
        <div>基准: zoom=1 时 1px=1坐标单位(GU)=100,000m</div>
    </div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 常量（全部换算为坐标单位 GU） ---
        const GAME_UNIT_IN_METERS = 100000;
        const AU_IN_METERS = 149597870700;
        const LY_IN_METERS = 9460730472580800;

        const AU_IN_GU = AU_IN_METERS / GAME_UNIT_IN_METERS;
        const LY_IN_GU = LY_IN_METERS / GAME_UNIT_IN_METERS;

        const SECTOR_DIAMETER_LY = 1;
        const SECTOR_DIAMETER_GU = SECTOR_DIAMETER_LY * LY_IN_GU;
        const SECTOR_SIZE_GU = SECTOR_DIAMETER_GU / 2;

        // --- 缩放与渲染规则 ---
        function guPerPixel(zoom) {
            return zoom;
        }

        const UI_PLANET_ZOOM_THRESHOLD = 20.0;
        const UI_STAR_ZOOM_THRESHOLD = 50.0;
        const UI_MARKER_RADIUS_PX = 4;
        const UI_PICK_RADIUS_PX = 10;

        // --- 相机（世界坐标单位：GU） ---
        const camera = {
            x: 0,
            y: 0,
            zoom: 1.0,
            minZoom: 0.1,
            maxZoom: 200000000, // 缩放上限提高10倍
        };

        const mouse = { x: 0, y: 0 };
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // --- 太阳系数据（单位：GU） ---
        const bodies = [
            { key: 'sun', name: '太阳', radiusGU: 696340000 / GAME_UNIT_IN_METERS, orbitRadiusGU: 0, color: '#ffd700' },
            { key: 'mercury', name: '水星', radiusGU: 2439700 / GAME_UNIT_IN_METERS, orbitRadiusGU: 0.387 * AU_IN_GU, color: '#a9a9a9' },
            { key: 'venus', name: '金星', radiusGU: 6051800 / GAME_UNIT_IN_METERS, orbitRadiusGU: 0.723 * AU_IN_GU, color: '#ffa500' },
            { key: 'earth', name: '地球', radiusGU: 6371000 / GAME_UNIT_IN_METERS, orbitRadiusGU: 1.0 * AU_IN_GU, color: '#4682b4' },
            { key: 'mars', name: '火星', radiusGU: 3389500 / GAME_UNIT_IN_METERS, orbitRadiusGU: 1.524 * AU_IN_GU, color: '#ff4500' },
            { key: 'jupiter', name: '木星', radiusGU: 69911000 / GAME_UNIT_IN_METERS, orbitRadiusGU: 5.203 * AU_IN_GU, color: '#d2b48c' },
            { key: 'saturn', name: '土星', radiusGU: 58232000 / GAME_UNIT_IN_METERS, orbitRadiusGU: 9.537 * AU_IN_GU, color: '#f5deb3' },
            { key: 'uranus', name: '天王星', radiusGU: 25362000 / GAME_UNIT_IN_METERS, orbitRadiusGU: 19.191 * AU_IN_GU, color: '#add8e6' },
            { key: 'neptune', name: '海王星', radiusGU: 24622000 / GAME_UNIT_IN_METERS, orbitRadiusGU: 30.069 * AU_IN_GU, color: '#4169e1' },
        ];

        // --- 坐标：hex 公式（输入输出单位均为 GU） ---
        function sectorCenterWorld2D_GU(s) {
            const size = SECTOR_SIZE_GU;
            const x = size * (Math.sqrt(3) * s.q + (Math.sqrt(3) / 2) * s.r);
            const y = size * ((3 / 2) * s.r);
            return { x, y };
        }

        function world2DToAxialFractional_GU(p) {
            const size = SECTOR_SIZE_GU;
            const q = (Math.sqrt(3) / 3 * p.x - 1 / 3 * p.y) / size;
            const r = (2 / 3 * p.y) / size;
            return { q, r };
        }

        function axialRound(q, r) {
            const x = q, z = r, y = -x - z;
            let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
            const xDiff = Math.abs(rx - x), yDiff = Math.abs(ry - y), zDiff = Math.abs(rz - z);
            if (xDiff > yDiff && xDiff > zDiff) rx = -ry - rz;
            else if (yDiff > zDiff) ry = -rx - rz;
            else rz = -rx - ry;
            return { q: rx, r: rz };
        }

        function world2DToSector_GU(p) {
            const fr = world2DToAxialFractional_GU(p);
            return axialRound(fr.q, fr.r);
        }

        function hexDistance(a, b) {
            const ax = a.q, az = a.r, ay = -ax - az;
            const bx = b.q, bz = b.r, by = -bx - bz;
            return (Math.abs(ax - bx) + Math.abs(ay - by) + Math.abs(az - bz)) / 2;
        }

        // --- 世界(GU)<->屏幕(px) ---
        function worldToScreen(pWorld_GU) {
            const gpp = guPerPixel(camera.zoom);
            return {
                x: (pWorld_GU.x - camera.x) / gpp + canvas.width / 2,
                y: (pWorld_GU.y - camera.y) / gpp + canvas.height / 2,
            };
        }

        function screenToWorld(pScreen_px) {
            const gpp = guPerPixel(camera.zoom);
            return {
                x: (pScreen_px.x - canvas.width / 2) * gpp + camera.x,
                y: (pScreen_px.y - canvas.height / 2) * gpp + camera.y,
            };
        }

        // --- 绘制与拾取缓存 ---
        let selected = null;
        const bodyCache = new Map();

        function drawHex(center_GU, size_GU) {
            const pts = [];
            for (let i = 0; i < 6; i++) {
                const ang = (Math.PI / 180) * (60 * i + 30);
                pts.push({ x: center_GU.x + size_GU * Math.cos(ang), y: center_GU.y + size_GU * Math.sin(ang) });
            }
            ctx.beginPath();
            const p0 = worldToScreen(pts[0]);
            ctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < pts.length; i++) {
                const pi = worldToScreen(pts[i]);
                ctx.lineTo(pi.x, pi.y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        function drawHexGrid() {
            const renderRadius = 5;
            ctx.strokeStyle = 'rgba(255,255,255,0.18)';
            ctx.lineWidth = 1;

            for (let q = -renderRadius; q <= renderRadius; q++) {
                for (let r = -renderRadius; r <= renderRadius; r++) {
                    if (hexDistance({ q: 0, r: 0 }, { q, r }) > renderRadius) continue;
                    const s = { q, r };
                    const c_GU = sectorCenterWorld2D_GU(s);
                    drawHex(c_GU, SECTOR_SIZE_GU);

                    const cp_px = worldToScreen(c_GU);
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(`${s.q},${s.r}`, cp_px.x, cp_px.y);
                }
            }
        }

        function drawSolarSystem(anchor_GU, systemId) {
            const isPlanetUiMode = camera.zoom >= UI_PLANET_ZOOM_THRESHOLD;
            const isStarUiMode = camera.zoom >= UI_STAR_ZOOM_THRESHOLD;
            const gpp = guPerPixel(camera.zoom);

            for (const b of bodies) {
                const isStar = b.key === 'sun';
                const shouldUseUi = isStar ? isStarUiMode : isPlanetUiMode;
                const world_GU = { x: anchor_GU.x + b.orbitRadiusGU, y: anchor_GU.y };
                const screen = worldToScreen(world_GU);
                const diameterPxReal = (2 * b.radiusGU) / gpp;
                const pickRadiusWorldGU = Math.max(2 * b.radiusGU, 6 * gpp);
                const bodyInstanceKey = `${systemId}-${b.key}`;

                bodyCache.set(bodyInstanceKey, { body: b, world_GU, screen, pickRadiusWorldGU, pickRadiusUiPx: UI_PICK_RADIUS_PX });

                if (!shouldUseUi) {
                    if (diameterPxReal < 0.5) continue;
                    ctx.beginPath();
                    ctx.fillStyle = b.color;
                    ctx.arc(screen.x, screen.y, Math.max(0.5, diameterPxReal / 2), 0, Math.PI * 2);
                    ctx.fill();
                    if (selected && selected.key === bodyInstanceKey) {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                } else {
                    if (screen.x < -50 || screen.x > canvas.width + 50 || screen.y < -50 || screen.y > canvas.height + 50) continue;
                    ctx.beginPath();
                    ctx.fillStyle = b.color;
                    ctx.arc(screen.x, screen.y, UI_MARKER_RADIUS_PX, 0, Math.PI * 2);
                    ctx.fill();
                    if (selected && selected.key === bodyInstanceKey) {
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(b.name, screen.x + 8, screen.y);
                }
            }
        }

        function updateHud() {
            document.getElementById('zoom').textContent = camera.zoom.toFixed(4);
            document.getElementById('cam').textContent = `x=${camera.x.toLocaleString(undefined, { maximumFractionDigits: 0 })}, y=${camera.y.toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
            const mw_GU = screenToWorld({ x: mouse.x, y: mouse.y });
            document.getElementById('mw').textContent = `x=${mw_GU.x.toLocaleString(undefined, { maximumFractionDigits: 0 })}, y=${mw_GU.y.toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
            const s = world2DToSector_GU(mw_GU);
            document.getElementById('ms').textContent = `${s.q}, ${s.r}`;

            const selEl = document.getElementById('sel');
            const selPosEl = document.getElementById('selpos');
            if (!selected) {
                selEl.textContent = '无';
                selPosEl.innerHTML = '';
                return;
            }
            const entry = bodyCache.get(selected.key);
            if (!entry) return;
            selEl.textContent = `${selected.name} (${selected.key})`;
            selPosEl.innerHTML = `<div class="hl">世界坐标(GU): x=${entry.world_GU.x.toLocaleString(undefined, { maximumFractionDigits: 2 })}, y=${entry.world_GU.y.toLocaleString(undefined, { maximumFractionDigits: 2 })}</div>`;
            const gpp = guPerPixel(camera.zoom);
            const diameterPxReal = (2 * entry.body.radiusGU) / gpp;
            selPosEl.innerHTML += `<div>真实直径像素(当前zoom): ${diameterPxReal.toFixed(2)}px</div>`;
        }

        function frame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            bodyCache.clear();

            drawHexGrid();

            // 在(0,0)星区绘制太阳系
            drawSolarSystem(sectorCenterWorld2D_GU({ q: 0, r: 0 }), 'sys0');

            // 在(5,0)边界星区绘制另一个太阳系
            drawSolarSystem(sectorCenterWorld2D_GU({ q: 5, r: 0 }), 'sys1');

            updateHud();
            requestAnimationFrame(frame);
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            if (isDragging) {
                const dxPx = mouse.x - lastMouseX;
                const dyPx = mouse.y - lastMouseY;
                const gpp = guPerPixel(camera.zoom);
                camera.x -= dxPx * gpp;
                camera.y -= dyPx * gpp;
            }
            lastMouseX = mouse.x;
            lastMouseY = mouse.y;
        });
        canvas.addEventListener('mousedown', (e) => { if (e.button === 0) { isDragging = true; lastMouseX = mouse.x; lastMouseY = mouse.y; } });
        canvas.addEventListener('mouseup', (e) => { if (e.button === 0) isDragging = false; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const sx = e.clientX - rect.left;
            const sy = e.clientY - rect.top;
            const isPlanetUiMode = camera.zoom >= UI_PLANET_ZOOM_THRESHOLD;
            const isStarUiMode = camera.zoom >= UI_STAR_ZOOM_THRESHOLD;

            let hit = null, bestDist2 = Infinity;

            for (const entry of bodyCache.values()) {
                const isStar = entry.body.key === 'sun';
                const shouldUseUi = isStar ? isStarUiMode : isPlanetUiMode;

                if (!shouldUseUi) {
                    const w_GU = screenToWorld({ x: sx, y: sy });
                    const dx = w_GU.x - entry.world_GU.x, dy = w_GU.y - entry.world_GU.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 <= entry.pickRadiusWorldGU * entry.pickRadiusWorldGU && d2 < bestDist2) {
                        bestDist2 = d2; hit = entry;
                    }
                } else {
                    const dx = sx - entry.screen.x, dy = sy - entry.screen.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 <= entry.pickRadiusUiPx * entry.pickRadiusUiPx && d2 < bestDist2) {
                        bestDist2 = d2; hit = entry;
                    }
                }
            }
            selected = hit ? { key: hit.key, name: hit.body.name } : null;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
            const before = screenToWorld({ x: sx, y: sy });
            const factor = 1.1;
            let z = camera.zoom;
            if (e.deltaY < 0) z /= factor; else z *= factor;
            camera.zoom = Math.max(camera.minZoom, Math.min(camera.maxZoom, z));
            const after = screenToWorld({ x: sx, y: sy });
            camera.x += (before.x - after.x);
            camera.y += (before.y - after.y);
        }, { passive: false });

        const anchor00_GU = sectorCenterWorld2D_GU({ q: 0, r: 0 });
        camera.x = anchor00_GU.x;
        camera.y = anchor00_GU.y;
        camera.zoom = 1000; // 初始zoom大一点，能看到星区

        frame();
    </script>
</body>

</html>
