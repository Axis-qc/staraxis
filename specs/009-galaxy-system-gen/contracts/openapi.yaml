openapi: 3.0.3
info:
  title: StarAxis WorldGen Debug API
  version: "0.1"
  description: |
    用于调试/验证世界生成与轨道/网格输出的契约（规划阶段产物）。
    该 API 设计为 server 模块的可选调试接口；核心逻辑仍应保持 headless 与渲染解耦。
servers:
  - url: http://localhost:8080
paths:
  /world/generate:
    post:
      summary: 生成世界（确定性）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldGenRequest'
      responses:
        '200':
          description: 生成结果摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldGenResponse'
  /star-system/{systemId}/orbit-paths:
    get:
      summary: 获取恒星系统内行星的轨道路径描述
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: string
        - name: precision
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PrecisionLevel'
      responses:
        '200':
          description: 轨道路径列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrbitPath'
  /planet/{planetId}/surface-mesh:
    get:
      summary: 获取行星球面网格拓扑
      parameters:
        - name: planetId
          in: path
          required: true
          schema:
            type: string
        - name: resolution
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ResolutionLevel'
      responses:
        '200':
          description: 球面网格
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanetSurfaceMesh'
components:
  schemas:
    PrecisionLevel:
      type: string
      enum: [low, medium, high]
    ResolutionLevel:
      type: string
      enum: [low, medium, high]
    WorldGenRequest:
      type: object
      required: [mapSizePresetId, seedValue]
      properties:
        mapSizePresetId:
          type: string
        seedValue:
          type: integer
          format: int64
        habitableRatio:
          type: number
          format: float
        starDensity:
          type: number
          format: float
        nebulaRatio:
          type: number
          format: float
        planetComplexity:
          type: number
          format: float
    WorldGenResponse:
      type: object
      required: [stats]
      properties:
        stats:
          type: object
          properties:
            tileCount:
              type: integer
            galaxyTileCount:
              type: integer
            starCount:
              type: integer
            planetCount:
              type: integer
        systemIds:
          type: array
          items:
            type: string
    OrbitPath:
      type: object
      required: [orbitId, precisionLevel, samples]
      properties:
        orbitId:
          type: string
        precisionLevel:
          $ref: '#/components/schemas/PrecisionLevel'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/Vec2'
    PlanetSurfaceMesh:
      type: object
      required: [resolutionLevel, tiles]
      properties:
        resolutionLevel:
          $ref: '#/components/schemas/ResolutionLevel'
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/SurfaceTile'
    SurfaceTile:
      type: object
      required: [tileId, tileType, neighbors]
      properties:
        tileId:
          type: string
        tileType:
          type: string
          enum: [hex, pent]
        neighbors:
          type: array
          items:
            type: string
    Vec2:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: float
        y:
          type: number
          format: float
