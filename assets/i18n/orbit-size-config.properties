# Orbit Size Configuration
# 轨道大小配置
# Format: orbit.size.{property}

# 轨道半长轴范围（AU）
# Orbit semi-major axis range (AU)
orbit.size.min.au=0.1
orbit.size.max.au=100.0

# 默认轨道半长轴（按轨道索引）
# Default orbit semi-major axis (by orbit index)
orbit.size.default.base.au=1.0
orbit.size.default.increment.au=1.25

# 真实行星系统参考值（AU）
# Real planetary system reference values (AU)
orbit.size.reference.mercury.au=0.387
orbit.size.reference.venus.au=0.723
orbit.size.reference.earth.au=1.0
orbit.size.reference.mars.au=1.524
orbit.size.reference.jupiter.au=5.203
orbit.size.reference.saturn.au=9.537
orbit.size.reference.uranus.au=19.191
orbit.size.reference.neptune.au=30.069
