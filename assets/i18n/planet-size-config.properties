# Planet Size Configuration
# 行星大小配置
# Format: planet.size.{typeId}.{property}

# 岩石行星（Rocky Planet，如地球）
# Rocky Planet (e.g., Earth)
planet.size.rocky.radius.au=0.0000426
planet.size.rocky.min.radius.au=0.00001
planet.size.rocky.max.radius.au=0.0001

# 气态巨行星（Gas Giant，如木星）
# Gas Giant (e.g., Jupiter)
planet.size.gas_giant.min.radius.au=0.0001
planet.size.gas_giant.max.radius.au=0.001
planet.size.gas_giant.default.radius.au=0.000477

# 冰巨星（Ice Giant，如海王星）
# Ice Giant (e.g., Neptune)
planet.size.ice_giant.min.radius.au=0.00005
planet.size.ice_giant.max.radius.au=0.0005
planet.size.ice_giant.default.radius.au=0.00015

# 真实行星参考值（半径，AU）
# Real planet reference values (radius, AU)
planet.size.reference.mercury.radius.au=0.000016
planet.size.reference.venus.radius.au=0.000039
planet.size.reference.earth.radius.au=0.0000426
planet.size.reference.mars.radius.au=0.0000226
planet.size.reference.jupiter.radius.au=0.000477
planet.size.reference.saturn.radius.au=0.000401
planet.size.reference.uranus.radius.au=0.000169
planet.size.reference.neptune.radius.au=0.000164
