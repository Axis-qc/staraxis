# Visual Scale Configuration
# 可视化缩放配置
# Format: visual.scale.{property}

# AU 到像素的转换比例（默认值，可配置）
# AU to pixels conversion ratio (default value, configurable)
visual.scale.au.to.pixels=0.00079

# 自动缩放设置
# Auto scale settings
visual.scale.auto.enabled=true
visual.scale.auto.min.factor=0.1
visual.scale.auto.max.factor=10.0

# 基础缩放比例
# Base scale factors
visual.scale.star.base=1.0
visual.scale.planet.base=0.5
visual.scale.orbit.base=1.0

# 手动缩放因子（默认值）
# Manual scale factor (default value)
visual.scale.manual.factor=1.0
