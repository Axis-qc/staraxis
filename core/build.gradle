[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
    api project(':shared')
    implementation "com.esotericsoftware:kryo:$kryoVersion"
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

tasks.register('checkNoGraphicsDependencies') {
    group = 'verification'
    description = 'Enforces zero graphics library (com.badlogic.gdx.graphics) in core module'
    doLast {
        def forbiddenImport = 'com.badlogic.gdx.graphics'
        def coreSourceDir = file('src/main/java')
        if (coreSourceDir.exists()) {
            coreSourceDir.eachFileRecurse { file ->
                if (file.name.endsWith('.java')) {
                    if (file.text.contains(forbiddenImport)) {
                        throw new GradleException("Forbidden import found in ${file.path}: ${forbiddenImport}. Core module must be headless.")
                    }
                }
            }
        }
    }
}

check.dependsOn checkNoGraphicsDependencies
