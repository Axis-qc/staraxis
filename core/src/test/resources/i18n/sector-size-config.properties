# Sector Size Configuration
# 星区大小配置
# Format: sector.size.{property}

# 默认星区大小（光年）
# Default sector size (light years)
sector.size.default.lightYears=1.0

# 是否可配置
# Whether configurable
sector.size.configurable=true

# 最小星区大小（光年，用于验证）
# Minimum sector size (light years, for validation)
sector.size.min.lightYears=0.1

# 最大星区大小（光年，用于验证）
# Maximum sector size (light years, for validation)
sector.size.max.lightYears=10.0
