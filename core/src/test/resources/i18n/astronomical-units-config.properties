# Astronomical Units System Configuration
# 天文单位系统配置
# Format: astronomical.units.{property}

# 缩放因子（内部单位到AU的转换）
# Scale factor: 1 AU = 10^12 internal units
astronomical.units.scale.factor=1000000000000

# 单位转换常数（精确值）
# Unit conversion constants (exact values)
astronomical.units.au.to.km=149600000.0
astronomical.units.ly.to.au=63241.077
astronomical.units.pc.to.au=206265.0

# 系统版本
# System version
astronomical.units.version=1.0.0
