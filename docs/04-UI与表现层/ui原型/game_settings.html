<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏设置 - 设计原型 v3</title>
    <style>
        /* --- 字体与全局变量 --- */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap');

        :root {
            --sa-bg0: #070712;
            --sa-panel: rgba(13, 14, 26, 0.82);
            --sa-stroke: rgba(34, 211, 238, 0.22);
            --sa-stroke-strong: rgba(34, 211, 238, 0.35);
            --text-color: rgba(244, 244, 255, 0.92);
            --text-color-muted: rgba(244, 244, 255, 0.6);
            --sa-glow: rgba(34, 211, 238, 0.55);
            --sa-accent: #22d3ee;
            --sa-accent-purple: #a855f7;
        }

        body {
            background-color: #000000;
            color: var(--text-color);
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0;
            padding: 2.5vh;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--sa-glow);
            margin: 0;
            color: var(--sa-accent);
        }

        /* --- 主布局 --- */
        .prototype-container {
            width: 900px;
            /* Wider panel for more settings */
            height: 80vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 20px;
        }

        /* --- 面板通用样式 (带切角) --- */
        .panel {
            background: var(--sa-panel);
            border: 1px solid var(--sa-stroke);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 30px;
            align-content: start;
        }

        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-top: 1px solid var(--sa-stroke);
            padding-top: 15px;
        }

        .settings-group h4 {
            font-size: 14px;
            color: var(--text-color);
            opacity: 0.8;
            margin-bottom: 5px;
        }

        /* --- 控件样式 --- */
        .setting-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 15px;
        }

        .setting-item label {
            font-size: 14px;
            opacity: 0.9;
        }

        .setting-item .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--sa-accent);
            min-width: 60px;
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--sa-stroke);
            border-radius: 2px;
            outline: none;
            grid-column: 1 / -1;
            margin-top: 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--sa-accent-purple);
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--sa-accent-purple);
        }

        /* --- 底部操作栏 --- */
        .footer-actions {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
        }

        .sa-btn {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--sa-stroke-strong);
            color: var(--text-color);
            padding: 12px 24px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .sa-btn:hover {
            border-color: var(--sa-glow);
            color: var(--text-color-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 12px var(--sa-glow);
        }

        .sa-btn.primary {
            background: var(--sa-accent-purple);
            border-color: var(--sa-accent-purple);
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="prototype-container">
        <header class="header">
            <h1>游戏设置</h1>
        </header>

        <main class="panel settings-grid">
            <div class="settings-group">
                <h4>星系形态</h4>
                <div class="setting-item">
                    <label>星系半径</label>
                    <span class="value" id="galaxy-radius-value">500</span>
                    <input type="range" id="galaxy-radius" min="200" max="1000" value="500" step="50"
                        oninput="updateValue('galaxy-radius')">
                </div>
                <div class="setting-item">
                    <label>恒星系比例</label>
                    <span class="value" id="star-ratio-value">50%</span>
                    <input type="range" id="star-ratio" min="10" max="100" value="50"
                        oninput="updateValue('star-ratio', null, '%')">
                </div>
            </div>

            <div class="settings-group">
                <h4>AI与难度</h4>
                <div class="setting-item">
                    <label>AI 难度</label>
                    <span class="value" id="ai-difficulty-value">中等</span>
                    <input type="range" id="ai-difficulty" min="1" max="5" value="3"
                        oninput="updateValue('ai-difficulty', ['极易', '简单', '中等', '困难', '疯狂'])">
                </div>
                <div class="setting-item">
                    <label>AI 侵略性</label>
                    <span class="value" id="ai-aggression-value">普通</span>
                    <input type="range" id="ai-aggression" min="1" max="3" value="2"
                        oninput="updateValue('ai-aggression', ['低', '普通', '高'])">
                </div>
            </div>

            <div class="settings-group">
                <h4>星球与资源</h4>
                <div class="setting-item">
                    <label>宜居星球比例</label>
                    <span class="value" id="habitable-ratio-value">25%</span>
                    <input type="range" id="habitable-ratio" min="5" max="50" value="25"
                        oninput="updateValue('habitable-ratio', null, '%')">
                </div>
                <div class="setting-item">
                    <label>战略资源密度</label>
                    <span class="value" id="resource-density-value">标准</span>
                    <input type="range" id="resource-density" min="1" max="3" value="2"
                        oninput="updateValue('resource-density', ['稀少', '标准', '丰富'])">
                </div>
            </div>

            <div class="settings-group">
                <h4>帝国与文明</h4>
                <div class="setting-item">
                    <label>AI 帝国数量</label>
                    <span class="value" id="ai-empires-value">5</span>
                    <input type="range" id="ai-empires" min="1" max="10" value="5" oninput="updateValue('ai-empires')">
                </div>
                <div class="setting-item">
                    <label>高级 AI 起步</label>
                    <span class="value" id="advanced-ai-value">2</span>
                    <input type="range" id="advanced-ai" min="0" max="5" value="2" oninput="updateValue('advanced-ai')">
                </div>
            </div>
        </main>

        <footer class="footer-actions">
            <button class="sa-btn" onclick="location.href='./empire_selection.html'">返回</button>
            <button class="sa-btn primary">开始游戏</button>
        </footer>
    </div>

    <script>
        function updateValue(id, labels, suffix = '') {
            const slider = document.getElementById(id);
            const display = document.getElementById(id + '-value');
            if (labels) {
                display.textContent = labels[slider.value - (slider.min || 0)];
            } else {
                display.textContent = slider.value + suffix;
            }
        }

        // Initialize values on load
        document.addEventListener('DOMContentLoaded', () => {
            updateValue('galaxy-radius');
            updateValue('star-ratio', null, '%');
            updateValue('ai-difficulty', ['极易', '简单', '中等', '困难', '疯狂']);
            updateValue('ai-aggression', ['低', '普通', '高']);
            updateValue('habitable-ratio', null, '%');
            updateValue('resource-density', ['稀少', '标准', '丰富']);
            updateValue('ai-empires');
            updateValue('advanced-ai');
        });
    </script>

</body>

</html>
