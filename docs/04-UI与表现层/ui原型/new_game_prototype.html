<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新游戏 - 设计原型 v2</title>
    <style>
        /* --- 字体 --- */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap');

        /* --- 全局与主题变量 --- */
        :root {
            --sa-bg0: #070712;
            --sa-bg1: #0b0a19;
            --sa-panel: rgba(13, 14, 26, 0.72);
            --sa-stroke: rgba(196, 181, 253, 0.18);
            --sa-stroke-strong: rgba(196, 181, 253, 0.28);
            --text-color: rgba(244, 244, 255, 0.92);
            --text-color-hover: #ffffff;
            --sa-glow: rgba(34, 211, 238, 0.55);
            --sa-accent: #a855f7;
            --sa-accent2: #22d3ee;
        }

        body {
            background-color: #000000;
            color: var(--text-color);
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0;
            padding: 40px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(rgba(34, 211, 238, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 211, 238, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        h1,
        h2,
        h3 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--sa-glow);
            margin: 0 0 20px 0;
            color: var(--sa-accent2);
        }

        /* --- 主布局 --- */
        .prototype-container {
            display: grid;
            grid-template-columns: 450px 1fr;
            grid-template-rows: auto 1fr;
            gap: 30px;
            flex-grow: 1;
            min-height: 0;
        }

        .header {
            grid-column: 1 / -1;
        }

        /* --- 面板通用样式 (带切角) --- */
        .panel {
            background: var(--sa-panel);
            border: 1px solid var(--sa-stroke);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        }

        /* --- 控件样式 --- */
        .setting-item {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 15px;
        }

        .setting-item label {
            font-size: 14px;
            opacity: 0.9;
        }

        .setting-item .value {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--sa-accent2);
            min-width: 60px;
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--sa-stroke);
            border-radius: 2px;
            outline: none;
            grid-column: 1 / -1;
            /* Slider spans both columns */
            margin-top: 8px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: var(--sa-accent);
            border: 2px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px var(--sa-glow);
        }

        /* --- 国家选择 --- */
        .empire-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            flex-grow: 1;
        }

        .empire-card,
        .create-empire-card {
            border: 1px solid var(--sa-stroke);
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            clip-path: polygon(0 10px, 10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }

        .empire-card:hover,
        .create-empire-card:hover {
            border-color: var(--sa-accent);
            transform: translateY(-4px);
            box-shadow: 0 0 15px var(--sa-glow);
        }

        .empire-card.selected {
            border-color: var(--sa-accent2);
            box-shadow: 0 0 20px var(--sa-accent2);
        }

        .empire-flag {
            width: 80px;
            height: 80px;
            background: #333;
            margin: 0 auto 15px;
            border: 2px solid var(--sa-stroke-strong);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .empire-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
        }

        .create-empire-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* --- 底部操作栏 --- */
        .footer-actions {
            grid-column: 1 / -1;
            padding-top: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
        }

        .sa-btn {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--sa-stroke-strong);
            color: var(--text-color);
            padding: 12px 24px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s ease;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .sa-btn:hover {
            border-color: var(--sa-glow);
            color: var(--text-color-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 12px var(--sa-glow);
        }

        .sa-btn.primary {
            background: var(--sa-accent);
            border-color: var(--sa-accent);
            color: #fff;
            text-shadow: 0 0 5px #000;
        }

        .sa-btn.primary:hover {
            box-shadow: 0 0 20px var(--sa-accent);
        }
    </style>
</head>

<body>

    <div class="prototype-container">
        <header class="header">
            <h1>创建新游戏</h1>
        </header>

        <!-- 左侧：游戏设置 -->
        <div class="panel">
            <h3>游戏设置</h3>

            <div class="setting-item">
                <label for="ai-difficulty">AI 难度</label>
                <span class="value" id="ai-difficulty-value">中等</span>
                <input type="range" id="ai-difficulty" min="1" max="5" value="3"
                    oninput="updateValue('ai-difficulty', ['极易', '简单', '中等', '困难', '疯狂'])">
            </div>

            <div class="setting-item">
                <label for="galaxy-radius">星系半径</label>
                <span class="value" id="galaxy-radius-value">500</span>
                <input type="range" id="galaxy-radius" min="200" max="1000" value="500" step="50"
                    oninput="updateValue('galaxy-radius')">
            </div>

            <div class="setting-item">
                <label for="star-ratio">恒星系比例</label>
                <span class="value" id="star-ratio-value">50%</span>
                <input type="range" id="star-ratio" min="10" max="100" value="50"
                    oninput="updateValue('star-ratio', null, '%')">
            </div>

            <div class="setting-item">
                <label for="habitable-ratio">宜居星球比例</label>
                <span class="value" id="habitable-ratio-value">25%</span>
                <input type="range" id="habitable-ratio" min="5" max="50" value="25"
                    oninput="updateValue('habitable-ratio', null, '%')">
            </div>
        </div>

        <!-- 右侧：国家选择与设置 -->
        <div class="panel">
            <h3>选择你的国家</h3>
            <div class="empire-list">
                <div class="empire-card selected">
                    <div class="empire-flag"></div>
                    <div class="empire-name">人类联邦</div>
                </div>
                <div class="empire-card">
                    <div class="empire-flag"></div>
                    <div class="empire-name">格式塔意识</div>
                </div>
                <div class="empire-card">
                    <div class="empire-flag"></div>
                    <div class="empire-name">机械神教</div>
                </div>
                <div class="create-empire-card">
                    <span>+</span>
                    <div>创建国家</div>
                </div>
            </div>
        </div>

        <div class="footer-actions">
            <button class="sa-btn">返回主菜单</button>
            <button class="sa-btn primary">开始游戏</button>
        </div>
    </div>

    <script>
        function updateValue(id, labels, suffix = '') {
            const slider = document.getElementById(id);
            const display = document.getElementById(id + '-value');
            if (labels) {
                display.textContent = labels[slider.value - 1];
            } else {
                display.textContent = slider.value + suffix;
            }
        }

        // Initialize values on load
        document.addEventListener('DOMContentLoaded', () => {
            updateValue('ai-difficulty', ['极易', '简单', '中等', '困难', '疯狂']);
            updateValue('galaxy-radius');
            updateValue('star-ratio', null, '%');
            updateValue('habitable-ratio', null, '%');
        });
    </script>

</body>

</html>
