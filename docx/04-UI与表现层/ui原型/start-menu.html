<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StarAxis - 开始菜单 UI 原型</title>
  <link rel="stylesheet" href="start-menu.css" />
</head>
<body>
  <div class="bg">
    <div class="stars"></div>
    <div class="nebula"></div>
    <div class="gridline"></div>
    <div class="scanline"></div>
    <div class="vignette"></div>
  </div>

  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <div class="logo">SA</div>
        <div class="text">
          <div class="name">StarAxis</div>
          <div class="sub">开始菜单（原型）</div>
        </div>
      </div>
      <div class="top-right">
        <button class="btn btn-ghost" id="btnLang">语言：简体中文</button>
        <button class="btn btn-ghost" id="btnLegal">许可</button>
      </div>
    </header>

    <main class="layout">
      <section class="menu">
        <div class="menu-title">开始游戏</div>
        <div class="menu-list">
          <button class="menu-item is-primary" data-open="newgame">新游戏</button>
          <button class="menu-item" data-open="loadgame">加载游戏</button>
          <button class="menu-item" data-open="multiplayer">多人游戏</button>
          <button class="menu-item" data-open="settings">设置</button>
          <button class="menu-item is-danger" id="btnQuit">退出游戏</button>
        </div>

        <div class="menu-footer">
          <div class="chip">版本：0.0.1</div>
          <div class="chip">构建：原型</div>
        </div>
      </section>

      <section class="content">
        <div class="content-card" id="panelEmpty">
          <div class="hero">
            <div class="hero-title">欢迎回来，指挥官</div>
            <div class="hero-sub">请选择左侧功能进入对应流程。本原型用于确定信息结构与交互，不代表最终美术。</div>
          </div>

          <div class="grid">
            <div class="stat">
              <div class="k">网络状态</div>
              <div class="v" id="uiNet">已连接（模拟）</div>
            </div>
            <div class="stat">
              <div class="k">云存档</div>
              <div class="v">未登录</div>
            </div>
            <div class="stat">
              <div class="k">上次游玩</div>
              <div class="v">从未</div>
            </div>
            <div class="stat">
              <div class="k">提示</div>
              <div class="v">可双击打开本 HTML 预览</div>
            </div>
          </div>
        </div>

        <div class="content-card is-hidden" id="panelNewGame">
          <div class="card-title">新游戏</div>
          <div class="form">
            <div class="row">
              <label>游戏模式</label>
              <div class="seg">
                <button class="seg-btn is-active" data-mode="single">单人</button>
                <button class="seg-btn" data-mode="coop">合作</button>
              </div>
            </div>

            <div class="row">
              <label>难度</label>
              <select class="input" id="selDifficulty">
                <option>普通</option>
                <option>困难</option>
                <option>噩梦</option>
              </select>
            </div>

            <div class="row">
              <label>银河规模</label>
              <select class="input" id="selGalaxy">
                <option>小</option>
                <option selected>中</option>
                <option>大</option>
              </select>
            </div>

            <div class="row">
              <label>种子</label>
              <input class="input" id="inputSeed" placeholder="留空=随机" />
            </div>

            <div class="row actions">
              <button class="btn" id="btnStart">开始</button>
              <button class="btn btn-ghost" data-back>返回</button>
            </div>
          </div>
        </div>

        <div class="content-card is-hidden" id="panelLoadGame">
          <div class="card-title">加载游戏</div>
          <div class="split">
            <div class="list" id="saveList"></div>
            <div class="detail" id="saveDetail">
              <div class="muted">选择一个存档查看详情</div>
            </div>
          </div>
          <div class="row actions" style="margin-top:12px;">
            <button class="btn" id="btnLoad">加载</button>
            <button class="btn" id="btnDelete">删除</button>
            <button class="btn btn-ghost" data-back>返回</button>
          </div>
        </div>

        <div class="content-card is-hidden" id="panelMultiplayer">
          <div class="card-title">多人游戏</div>
          <div class="form">
            <div class="row">
              <label>昵称</label>
              <input class="input" value="Commander" />
            </div>
            <div class="row">
              <label>连接方式</label>
              <div class="seg">
                <button class="seg-btn is-active" data-mp="quick">快速加入</button>
                <button class="seg-btn" data-mp="host">创建房间</button>
                <button class="seg-btn" data-mp="join">加入房间</button>
              </div>
            </div>
            <div class="row">
              <label>房间地址</label>
              <input class="input" placeholder="ip:port" value="127.0.0.1:7777" />
            </div>
            <div class="row actions">
              <button class="btn" id="btnMp">开始连接</button>
              <button class="btn btn-ghost" data-back>返回</button>
            </div>
          </div>
        </div>

        <div class="content-card is-hidden" id="panelSettings">
          <div class="card-title">设置</div>
          <div class="form">
            <div class="row">
              <label>显示</label>
              <div class="seg">
                <button class="seg-btn is-active">窗口</button>
                <button class="seg-btn">全屏</button>
              </div>
            </div>
            <div class="row">
              <label>音量</label>
              <input type="range" min="0" max="100" value="70" />
            </div>
            <div class="row">
              <label>UI 缩放</label>
              <input type="range" min="50" max="150" value="100" />
            </div>
            <div class="row actions">
              <button class="btn" id="btnSaveSettings">保存</button>
              <button class="btn btn-ghost" data-back>返回</button>
            </div>
          </div>
        </div>

      </section>
    </main>

    <div class="toast" id="toast" aria-live="polite"></div>

    <div class="modal is-hidden" id="modalQuit">
      <div class="modal-card">
        <div class="modal-title">确认退出</div>
        <div class="modal-body">确定要退出游戏吗？（原型，不会真的退出）</div>
        <div class="modal-actions">
          <button class="btn btn-danger" id="btnQuitConfirm">退出</button>
          <button class="btn btn-ghost" id="btnQuitCancel">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="start-menu.js"></script>
</body>
</html>
